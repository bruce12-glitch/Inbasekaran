<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Writing mascot - thoughtful author with quill and book">
  <defs>
    <linearGradient id="writing-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="writing-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A888FF;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#151515" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Body -->
  <rect x="20" y="35" width="80" height="65" rx="16" fill="url(#writing-body)" filter="url(#soft-shadow)"/>
  <!-- Head -->
  <ellipse cx="60" cy="32" rx="28" ry="26" fill="url(#writing-body)" filter="url(#soft-shadow)"/>
  <!-- Eyes - thoughtful, slightly narrowed -->
  <g class="mascot-eyes">
    <ellipse cx="50" cy="28" rx="4" ry="3" fill="#2D3A4A" class="eye-left"/>
    <ellipse cx="70" cy="28" rx="4" ry="3" fill="#2D3A4A" class="eye-right"/>
    <!-- Eyelids for thoughtful look -->
    <ellipse cx="50" cy="26" rx="4" ry="1.5" fill="url(#writing-body)"/>
    <ellipse cx="70" cy="26" rx="4" ry="1.5" fill="url(#writing-body)"/>
  </g>
  <!-- Cheeks - subtle -->
  <circle cx="38" cy="38" r="4" fill="#E8D4FF" opacity="0.8" class="cheek-left"/>
  <circle cx="82" cy="38" r="4" fill="#E8D4FF" opacity="0.8" class="cheek-right"/>
  <!-- Small contemplative mouth -->
  <ellipse cx="60" cy="42" rx="3" ry="1.5" fill="#2D3A4A" opacity="0.6"/>
  <!-- Open book on lap -->
  <g class="mascot-prop" transform="translate(12, 55)">
    <path d="M0 0 L0 30 L25 30 L25 0 Z" fill="#FFF" stroke="#E5E5E9" stroke-width="1.5"/>
    <path d="M0 0 L0 30 L25 30 L25 0 Z" fill="none" stroke="#A888FF" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <!-- Spine -->
    <line x1="12.5" y1="0" x2="12.5" y2="30" stroke="#C8A8FF" stroke-width="1.5" opacity="0.5"/>
    <!-- Lines on pages -->
    <g stroke="#BDBDC4" stroke-width="0.8" opacity="0.6">
      <line x1="3" y1="8" x2="22" y2="8"/>
      <line x1="3" y1="13" x2="22" y2="13"/>
      <line x1="3" y1="18" x2="22" y2="18"/>
      <line x1="3" y1="23" x2="22" y2="23"/>
    </g>
  </g>
  <!-- Quill pen (held) -->
  <g class="mascot-prop" transform="translate(95, 50) rotate(-30)">
    <!-- Feather -->
    <path d="M0 0 Q-8 -15 -4 -30 Q0 -25 4 -30 Q8 -15 0 0" fill="#C8A8FF" opacity="0.9"/>
    <path d="M0 0 Q-4 -10 -2 -20 Q0 -17 2 -20 Q4 -10 0 0" fill="#A888FF" opacity="0.7"/>
    <!-- Nib -->
    <path d="M-1 0 L1 0 L0 6 Z" fill="#2D3A4A"/>
    <!-- Ink drop -->
    <circle cx="2" cy="8" r="1.5" fill="#A888FF" opacity="0.7"/>
  </g>
  <!-- Floating letters/ink blots -->
  <g class="mascot-sparkles" opacity="0.7" font-family="Georgia, serif" font-size="14" font-weight="600">
    <text x="105" y="30" fill="#C8A8FF">✦</text>
    <text x="10" y="35" fill="#A888FF">✧</text>
    <text x="100" y="80" fill="#C8A8FF">✦</text>
    <text x="15" y="90" fill="#A888FF">✧</text>
  </g>
</svg>