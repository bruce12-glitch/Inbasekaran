<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Contact mascot - friendly messenger with envelope and speech bubble">
  <defs>
    <linearGradient id="contact-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8FFE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4FFD4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contact-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7AFF7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4AE84A;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#151515" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Body -->
  <rect x="20" y="35" width="80" height="65" rx="16" fill="url(#contact-body)" filter="url(#soft-shadow)"/>
  <!-- Head -->
  <ellipse cx="60" cy="32" rx="28" ry="26" fill="url(#contact-body)" filter="url(#soft-shadow)"/>
  <!-- Eyes - friendly, wide -->
  <g class="mascot-eyes">
    <circle cx="50" cy="28" r="4.5" fill="#2D3A4A" class="eye-left"/>
    <circle cx="70" cy="28" r="4.5" fill="#2D3A4A" class="eye-right"/>
    <!-- Highlights -->
    <circle cx="52" cy="26" r="1.8" fill="#FFF"/>
    <circle cx="72" cy="26" r="1.8" fill="#FFF"/>
  </g>
  <!-- Cheeks - warm green tint -->
  <circle cx="38" cy="40" r="6" fill="#A8E8A8" opacity="0.8" class="cheek-left"/>
  <circle cx="82" cy="40" r="6" fill="#A8E8A8" opacity="0.8" class="cheek-right"/>
  <!-- Big friendly smile -->
  <path d="M45 42 Q60 52 75 42" fill="none" stroke="#2D3A4A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Envelope (held) -->
  <g class="mascot-prop" transform="translate(95, 50)">
    <rect x="-12" y="-8" width="24" height="18" rx="2" fill="#FFF" stroke="#7AFF7A" stroke-width="2"/>
    <path d="M-12 -8 L0 2 L12 -8" fill="none" stroke="#4AE84A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-12 -8 L12 -8" fill="none" stroke="#7AFF7A" stroke-width="1.5"/>
    <!-- Seal -->
    <circle cx="0" cy="-2" r="3" fill="#4AE84A" opacity="0.8"/>
  </g>
  <!-- Speech bubble (floating near head) -->
  <g class="mascot-prop" transform="translate(-15, 10)">
    <path d="M15 15 Q25 15 25 25 Q25 35 15 35 Q5 35 5 25 Q5 15 15 15" fill="#FFF" stroke="#7AFF7A" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <path d="M15 35 L20 35 L15 42 Z" fill="#FFF" stroke="#7AFF7A" stroke-width="1.5"/>
    <text x="20" y="28" text-anchor="middle" font-size="10" fill="#2D3A4A" font-family="system-ui, sans-serif" font-weight="600">Hi!</text>
  </g>
  <!-- Floating hearts/messages -->
  <g class="mascot-sparkles" opacity="0.8">
    <path d="M100 25 Q103 22 106 25 Q109 22 106 29 Q103 26 100 25" fill="#FFB3C6"/>
    <path d="M10 30 Q13 27 16 30 Q19 27 16 34 Q13 31 10 30" fill="#7AFF7A"/>
    <path d="M100 85 Q103 82 106 85 Q109 82 106 89 Q103 86 100 85" fill="#A8D0FF"/>
    <circle cx="15" cy="60" r="2.5" fill="#4AE84A"/>
    <circle cx="105" cy="70" r="2" fill="#FFB3C6"/>
  </g>
</svg>