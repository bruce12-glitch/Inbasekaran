<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Research mascot - curious scholar with magnifying glass">
  <defs>
    <linearGradient id="research-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1E8FC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="research-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7AB8FF;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#151515" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Body (rounded rectangle with subtle curve) -->
  <rect x="20" y="35" width="80" height="65" rx="16" fill="url(#research-body)" filter="url(#soft-shadow)"/>
  <!-- Head -->
  <ellipse cx="60" cy="32" rx="28" ry="26" fill="url(#research-body)" filter="url(#soft-shadow)"/>
  <!-- Face features -->
  <!-- Eyes - simple dots that can blink -->
  <g class="mascot-eyes">
    <circle cx="50" cy="28" r="3.5" fill="#2D3A4A" class="eye-left"/>
    <circle cx="70" cy="28" r="3.5" fill="#2D3A4A" class="eye-right"/>
  </g>
  <!-- Cheeks -->
  <circle cx="40" cy="38" r="5" fill="#F5D6E8" opacity="0.6" class="cheek-left"/>
  <circle cx="80" cy="38" r="5" fill="#F5D6E8" opacity="0.6" class="cheek-right"/>
  <!-- Magnifying glass (held) -->
  <g class="mascot-prop" transform="translate(95, 55)">
    <circle r="14" fill="none" stroke="#7AB8FF" stroke-width="3"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="#7AB8FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="13" fill="#E8F4FD" opacity="0.3"/>
  </g>
  <!-- Notebook on belly -->
  <rect x="45" y="58" width="30" height="24" rx="4" fill="#FFF" opacity="0.9" stroke="#E5E5E9" stroke-width="1.5"/>
  <line x1="45" y1="65" x2="75" y2="65" stroke="#BDBDC4" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="45" y1="72" x2="75" y2="72" stroke="#BDBDC4" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Tiny sparkles around -->
  <g class="mascot-sparkles" opacity="0.7">
    <polygon points="6,52 8,56 4,56" fill="#FFD966"/>
    <polygon points="112,55 114,59 110,59" fill="#A8D0FF"/>
    <polygon points="10,85 12,89 8,89" fill="#F5D6E8"/>
  </g>
</svg>