<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Updates mascot - news bearer with newspaper and megaphone">
  <defs>
    <linearGradient id="updates-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF7D6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDF0BC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="updates-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC947;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#151515" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Body -->
  <rect x="20" y="35" width="80" height="65" rx="16" fill="url(#updates-body)" filter="url(#soft-shadow)"/>
  <!-- Head -->
  <ellipse cx="60" cy="32" rx="28" ry="26" fill="url(#updates-body)" filter="url(#soft-shadow)"/>
  <!-- Eyes - alert, curious -->
  <g class="mascot-eyes">
    <circle cx="50" cy="28" r="4" fill="#2D3A4A" class="eye-left"/>
    <circle cx="70" cy="28" r="4" fill="#2D3A4A" class="eye-right"/>
    <circle cx="52" cy="26" r="1.5" fill="#FFF"/>
    <circle cx="72" cy="26" r="1.5" fill="#FFF"/>
  </g>
  <!-- Cheeks -->
  <circle cx="38" cy="40" r="5" fill="#FFD966" opacity="0.6" class="cheek-left"/>
  <circle cx="82" cy="40" r="5" fill="#FFD966" opacity="0.6" class="cheek-right"/>
  <!-- Excited mouth -->
  <path d="M50 42 Q60 38 70 42" fill="none" stroke="#2D3A4A" stroke-width="2" stroke-linecap="round"/>
  <!-- Newspaper (held) -->
  <g class="mascot-prop" transform="translate(12, 55)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#FFF" stroke="#E5E5E9" stroke-width="1.5"/>
    <rect x="4" y="4" width="22" height="6" rx="1" fill="#2D3A4A" opacity="0.8"/>
    <rect x="4" y="14" width="22" height="3" rx="1" fill="#BDBDC4" opacity="0.6"/>
    <rect x="4" y="20" width="18" height="3" rx="1" fill="#BDBDC4" opacity="0.6"/>
    <rect x="4" y="26" width="22" height="3" rx="1" fill="#BDBDC4" opacity="0.6"/>
    <rect x="4" y="32" width="15" height="3" rx="1" fill="#BDBDC4" opacity="0.6"/>
    <!-- Fold line -->
    <line x1="15" y1="0" x2="15" y2="40" stroke="#FFD966" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  </g>
  <!-- Megaphone (held up) -->
  <g class="mascot-prop" transform="translate(95, 45) rotate(-15)">
    <path d="M0 0 L-20 -10 L-20 10 Z" fill="url(#updates-accent)" stroke="#FFC947" stroke-width="1.5"/>
    <path d="M-20 -10 L-35 -18 L-35 18 L-20 10" fill="url(#updates-accent)" stroke="#FFC947" stroke-width="1.5"/>
    <line x1="-35" y1="-18" x2="-35" y2="18" stroke="#FFD966" stroke-width="2" opacity="0.5"/>
    <circle cx="-27" cy="0" r="3" fill="#2D3A4A" opacity="0.6"/>
  </g>
  <!-- Floating new badges/sparkles -->
  <g class="mascot-sparkles" opacity="0.8">
    <rect x="100" y="20" width="16" height="10" rx="2" fill="#FFD966">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="101" y="28" font-size="7" fill="#2D3A4A" font-weight="bold" font-family="system-ui">NEW</text>
    <circle cx="15" cy="35" r="3" fill="#A8D0FF">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="80" r="2.5" fill="#FFB3C6"/>
    <polygon points="60,8 62,12 58,12" fill="#FFD966"/>
    <polygon points="60,105 62,109 58,109" fill="#A8D0FF"/>
  </g>
</svg>